name: Telegram command bridge

# Postino IN ENTRATA (rovescio di telegram-notify.yml), modalita' "a chiamata".
# Ogni ~5 min interroga il bot (getUpdates) ed esegue i comandi di Luca e i tap
# sulle schede-ordine (callback_query).
# ping/stato/aiuto: solo Python, nessun costo AI.
# aggiornami: fa partire un ragionamento Claude headless SOLO quando richiesto
#   (raro), quindi il costo si paga solo per le poche richieste vere.
# Serverless: nessuna macchina accesa. Riusa i secret TELEGRAM_*.
# Per il parere ragionato serve UN secret in piu': CLAUDE_CODE_OAUTH_TOKEN
#   (da `claude setup-token`, usa il piano Claude di Luca) OPPURE ANTHROPIC_API_KEY.
#   Senza, 'aggiornami' ripiega sulla foto rapida (ping/stato restano ok).
# Latenza reale ~5-10 min (cron GitHub UTC, spesso in ritardo). Forzabile da Actions -> Run workflow.

on:
  # Poll di FALLBACK. Se è attivo un webhook (telegram-webhook.yml) il poll si
  # fa da parte DA SOLO (tg-bridge controlla getWebhookInfo e non fa deleteWebhook),
  # quindi cron e webhook non litigano. Utile finché il webhook non è configurato.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-command
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll Telegram ed esegui i comandi (no AI)
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            export DIGEST_ENABLED=1
          else
            export DIGEST_ENABLED=0
          fi
          python3 market-watch/tg-bridge.py poll

      - name: Genera e invia l'aggiornami ragionato (solo se richiesto)
        if: steps.poll.outputs.need_digest == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          cat > /tmp/prompt.txt <<'PROMPT'
          Sei nel repository personale di gestione investimenti (rispetta CLAUDE.md).
          Il repo e' GIA' aggiornato: NON fare git pull/commit/push, NON modificare file: sola lettura.
          Esegui il ragionamento del comando /aggiornami: leggi market-watch/ultimo.md e il contesto
          (data/portfolio.json, data/watchlist.json, data/calendar.json, data/rules.json) e produci la
          TUA lettura ragionata del giro: cosa tenere d'occhio, dove punteresti con QUANDO (prezzo) /
          QUANTO (EUR dalla riserva) / uscita, drawdown o invalidazioni, riserva disponibile.
          E' un messaggio TELEGRAM: italiano semplice, NIENTE tabelle, NIENTE titoli con '#',
          elenchi con '•' se servono, massimo ~3500 caratteri. Rispondi SOLO col testo del messaggio.
          PROMPT
          if claude -p "$(cat /tmp/prompt.txt)" --allowedTools "Read,Grep,Glob" --output-format text > /tmp/digest.txt 2> /tmp/claude.err; then
            echo "digest generato ($(wc -c < /tmp/digest.txt) byte)"
          else
            echo "claude -p fallito:"; cat /tmp/claude.err || true
            echo "⚠️ Non sono riuscito a generare l'aggiornami completo (errore tecnico). Usa 'stato' o riprova piu' tardi." > /tmp/digest.txt
          fi
          python3 market-watch/tg-bridge.py send /tmp/digest.txt

      - name: Committa stato/log se cambiati
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessun cambiamento da salvare."
            exit 0
          fi
          git config user.name "tg-bridge"
          git config user.email "tg-bridge@users.noreply.github.com"
          git add -A
          git commit -m "tg-bridge: stato/richieste $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin main || true
          git push origin main
